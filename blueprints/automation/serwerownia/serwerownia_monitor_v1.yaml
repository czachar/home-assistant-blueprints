blueprint:
  name: "Serwerownia Monitor v1.2"
  description: >
    Centralny monitoring serwerowni: UPS/NUT, VM/LXC, storage, RAM oraz Seagate SMART.
    Blueprint tworzy trwałe powiadomienia Home Assistant oraz opcjonalne
    powiadomienia PUSH do aplikacji Home Assistant przy zaniku zasilania,
    powrocie zasilania, dłuższym offline urządzeń, wysokim zajęciu storage,
    wysokim użyciu RAM, problemie SMART dysku i wysokiej temperaturze dysku.
    W komunikatach UPS używa czytelnych nazw ON BATTERY / ON LINE,
    a techniczne wartości NUT pozostają OB / OL.
  domain: automation
  source_url: "https://raw.githubusercontent.com/czachar/home-assistant-blueprints/main/blueprints/automation/serwerownia/serwerownia_monitor_v1.yaml"

  input:
    ups_section:
      name: "UPS / Zasilanie"
      icon: mdi:power-plug-battery
      collapsed: false
      input:
        ups_status_entity:
          name: "Status UPS (NUT)"
          description: "Np. sensor.ups_dane_stanu"
          selector:
            entity:
              filter:
                - domain: sensor

        ups_load_entity:
          name: "Obciążenie UPS"
          description: "Np. sensor.ups_obciazenie"
          selector:
            entity:
              filter:
                - domain: sensor

        ups_battery_voltage_entity:
          name: "Napięcie baterii UPS"
          description: "Np. sensor.ups_napiecie_baterii"
          selector:
            entity:
              filter:
                - domain: sensor

        ups_input_voltage_entity:
          name: "Napięcie wejściowe UPS"
          description: "Np. sensor.ups_napiecie_wejsciowe"
          selector:
            entity:
              filter:
                - domain: sensor

        ups_on_battery_state:
          name: "ON BATTERY - kod NUT"
          description: "Pozostaw OB dla Twojego UPS. To techniczna wartość sensora NUT."
          default: "OB"
          selector:
            text: {}

        ups_online_state:
          name: "ON LINE - kod NUT"
          description: "Pozostaw OL dla Twojego UPS. To techniczna wartość sensora NUT."
          default: "OL"
          selector:
            text: {}

    devices_section:
      name: "VM / LXC / Urządzenia"
      icon: mdi:server
      collapsed: false
      input:
        monitored_entities:
          name: "Monitorowane encje"
          description: >
            Wybierz statusy VM/LXC, np. OMV, ownCloud, Jellyfin, Pi-hole, CODEX.
          selector:
            entity:
              multiple: true

        device_offline_state:
          name: "Stan oznaczający offline"
          default: "off"
          selector:
            text: {}

        device_online_state:
          name: "Stan oznaczający online"
          default: "on"
          selector:
            text: {}

        offline_delay:
          name: "Alarm po czasie offline"
          default:
            hours: 0
            minutes: 5
            seconds: 0
          selector:
            duration: {}

    storage_section:
      name: "Storage / Dyski"
      icon: mdi:harddisk
      collapsed: false
      input:
        storage_entities:
          name: "Sensory zajętości storage"
          description: >
            Wybierz sensory procentowego zajęcia, np. backup OMV, Seagate, /.
          selector:
            entity:
              multiple: true
              filter:
                - domain: sensor

        storage_warning_threshold:
          name: "Próg ostrzeżenia"
          default: 80
          selector:
            number:
              min: 50
              max: 99
              step: 1
              unit_of_measurement: "%"

        storage_critical_threshold:
          name: "Próg krytyczny"
          default: 90
          selector:
            number:
              min: 60
              max: 100
              step: 1
              unit_of_measurement: "%"

        storage_delay:
          name: "Czas utrzymania przekroczenia"
          default:
            hours: 0
            minutes: 10
            seconds: 0
          selector:
            duration: {}

    seagate_section:
      name: "Seagate / SMART"
      icon: mdi:harddisk-alert
      collapsed: false
      input:
        seagate_smart_problem_entity:
          name: "Seagate SMART Problem"
          description: >
            Binary sensor stanu SMART. U Ciebie alarmuje dopiero po pogorszeniu
            obecnej bazy: Pending > 8, Uncorrectable > 8 lub Reallocated > 0.
          default: binary_sensor.seagate_smart_problem
          selector:
            entity:
              filter:
                - domain: binary_sensor

        seagate_temperature_entity:
          name: "Temperatura Seagate"
          default: sensor.seagate_temperature
          selector:
            entity:
              filter:
                - domain: sensor

        seagate_pending_entity:
          name: "Pending sectors"
          default: sensor.seagate_pending_sectors
          selector:
            entity:
              filter:
                - domain: sensor

        seagate_uncorrectable_entity:
          name: "Offline uncorrectable"
          default: sensor.seagate_offline_uncorrectable
          selector:
            entity:
              filter:
                - domain: sensor

        seagate_reallocated_entity:
          name: "Reallocated sectors"
          default: sensor.seagate_reallocated_sectors
          selector:
            entity:
              filter:
                - domain: sensor

        seagate_temp_warning_threshold:
          name: "Temperatura - ostrzeżenie"
          default: 45
          selector:
            number:
              min: 30
              max: 70
              step: 1
              unit_of_measurement: "°C"

        seagate_temp_critical_threshold:
          name: "Temperatura - alarm krytyczny"
          default: 50
          selector:
            number:
              min: 35
              max: 80
              step: 1
              unit_of_measurement: "°C"

        seagate_temp_recovery_threshold:
          name: "Temperatura - powrót do normy"
          description: "Histereza dla powiadomienia recovery."
          default: 43
          selector:
            number:
              min: 20
              max: 60
              step: 1
              unit_of_measurement: "°C"

        seagate_temp_delay:
          name: "Czas utrzymania temperatury"
          description: "Chroni przed alarmem od krótkiego skoku temperatury."
          default:
            hours: 0
            minutes: 2
            seconds: 0
          selector:
            duration: {}

    ram_section:
      name: "RAM"
      icon: mdi:memory
      collapsed: true
      input:
        ram_entity:
          name: "Sensor RAM"
          description: >
            Najlepiej realny RAM OMV z Glances, a nie RAM widziany z Proxmoxa.
          selector:
            entity:
              filter:
                - domain: sensor

        ram_warning_threshold:
          name: "Próg RAM"
          default: 90
          selector:
            number:
              min: 50
              max: 100
              step: 1
              unit_of_measurement: "%"

        ram_recovery_threshold:
          name: "Próg powrotu RAM do normy"
          default: 80
          selector:
            number:
              min: 20
              max: 99
              step: 1
              unit_of_measurement: "%"

        ram_delay:
          name: "Alarm RAM po czasie"
          default:
            hours: 0
            minutes: 10
            seconds: 0
          selector:
            duration: {}

    notification_section:
      name: "Powiadomienia"
      icon: mdi:bell-alert
      collapsed: false
      input:
        notify_recovery:
          name: "Powiadamiaj o powrocie do normy"
          default: true
          selector:
            boolean: {}

        enable_mobile_notifications:
          name: "Powiadomienia PUSH do aplikacji"
          description: "Włącz wysyłanie tych samych alarmów do aplikacji Home Assistant."
          default: true
          selector:
            boolean: {}

        mobile_notify_service:
          name: "Usługa powiadomień telefonu"
          description: >
            Dla Twojego telefonu: notify.mobile_app_s24_ultra. Jeśli zmienisz telefon,
            wpisz tutaj nową nazwę usługi notify.mobile_app_...
          default: "notify.mobile_app_s24_ultra"
          selector:
            text: {}

        custom_actions:
          name: "Dodatkowe akcje po każdym alarmie"
          description: >
            Opcjonalne akcje poza powiadomieniem HA i PUSH.
          default: []
          selector:
            action: {}

variables:
  ups_load_entity_var: !input ups_load_entity
  ups_battery_voltage_entity_var: !input ups_battery_voltage_entity
  ups_input_voltage_entity_var: !input ups_input_voltage_entity
  seagate_pending_entity_var: !input seagate_pending_entity
  seagate_uncorrectable_entity_var: !input seagate_uncorrectable_entity
  seagate_reallocated_entity_var: !input seagate_reallocated_entity
  notify_recovery_var: !input notify_recovery
  enable_mobile_notifications_var: !input enable_mobile_notifications
  mobile_notify_service_var: !input mobile_notify_service

triggers:
  - trigger: state
    entity_id: !input ups_status_entity
    to: !input ups_on_battery_state
    id: ups_on_battery

  - trigger: state
    entity_id: !input ups_status_entity
    to: !input ups_online_state
    id: ups_online

  - trigger: state
    entity_id: !input monitored_entities
    to: !input device_offline_state
    for: !input offline_delay
    id: device_offline

  - trigger: state
    entity_id: !input monitored_entities
    to: !input device_online_state
    id: device_online

  - trigger: numeric_state
    entity_id: !input storage_entities
    above: !input storage_warning_threshold
    for: !input storage_delay
    id: storage_warning

  - trigger: numeric_state
    entity_id: !input storage_entities
    above: !input storage_critical_threshold
    for: !input storage_delay
    id: storage_critical

  - trigger: numeric_state
    entity_id: !input storage_entities
    below: !input storage_warning_threshold
    id: storage_recovered

  - trigger: state
    entity_id: !input seagate_smart_problem_entity
    from: "off"
    to: "on"
    id: seagate_smart_problem

  - trigger: state
    entity_id: !input seagate_smart_problem_entity
    from: "on"
    to: "off"
    id: seagate_smart_recovered

  - trigger: numeric_state
    entity_id: !input seagate_temperature_entity
    above: !input seagate_temp_warning_threshold
    for: !input seagate_temp_delay
    id: seagate_temp_warning

  - trigger: numeric_state
    entity_id: !input seagate_temperature_entity
    above: !input seagate_temp_critical_threshold
    for: !input seagate_temp_delay
    id: seagate_temp_critical

  - trigger: numeric_state
    entity_id: !input seagate_temperature_entity
    below: !input seagate_temp_recovery_threshold
    for: !input seagate_temp_delay
    id: seagate_temp_recovered

  - trigger: numeric_state
    entity_id: !input ram_entity
    above: !input ram_warning_threshold
    for: !input ram_delay
    id: ram_warning

  - trigger: numeric_state
    entity_id: !input ram_entity
    below: !input ram_recovery_threshold
    id: ram_recovered

conditions: []

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: ups_on_battery
        sequence:
          - action: persistent_notification.create
            data:
              title: "⚠️ UPS - ON BATTERY"
              message: >-
                Zanik zasilania sieciowego. UPS pracuje z baterii.
                Obciążenie: {{ states(ups_load_entity_var) }}%.
                Napięcie baterii: {{ states(ups_battery_voltage_entity_var) }} V.
          - if:
              - condition: template
                value_template: "{{ enable_mobile_notifications_var }}"
            then:
              - action: "{{ mobile_notify_service_var }}"
                data:
                  title: "⚠️ UPS - ON BATTERY"
                  message: >-
                    Zanik zasilania. Obciążenie UPS: {{ states(ups_load_entity_var) }}%.
                    Bateria: {{ states(ups_battery_voltage_entity_var) }} V.
          - choose: []
            default: !input custom_actions

      - conditions:
          - condition: trigger
            id: ups_online
          - condition: template
            value_template: "{{ notify_recovery_var }}"
        sequence:
          - action: persistent_notification.create
            data:
              title: "✅ UPS - ON LINE"
              message: >-
                Zasilanie sieciowe wróciło. UPS pracuje ON LINE.
                Napięcie wejściowe: {{ states(ups_input_voltage_entity_var) }} V.
                Napięcie baterii: {{ states(ups_battery_voltage_entity_var) }} V.
          - if:
              - condition: template
                value_template: "{{ enable_mobile_notifications_var }}"
            then:
              - action: "{{ mobile_notify_service_var }}"
                data:
                  title: "✅ UPS - ON LINE"
                  message: >-
                    Zasilanie wróciło. Napięcie wejściowe: {{ states(ups_input_voltage_entity_var) }} V.
                    Bateria: {{ states(ups_battery_voltage_entity_var) }} V.

      - conditions:
          - condition: trigger
            id: device_offline
        sequence:
          - action: persistent_notification.create
            data:
              title: "🔴 Urządzenie OFFLINE"
              message: >-
                {{ trigger.to_state.name }} jest offline od wymaganego czasu.
                Encja: {{ trigger.entity_id }}
          - if:
              - condition: template
                value_template: "{{ enable_mobile_notifications_var }}"
            then:
              - action: "{{ mobile_notify_service_var }}"
                data:
                  title: "🔴 Serwerownia - OFFLINE"
                  message: "{{ trigger.to_state.name }} jest offline."
          - choose: []
            default: !input custom_actions

      - conditions:
          - condition: trigger
            id: device_online
          - condition: template
            value_template: "{{ notify_recovery_var }}"
        sequence:
          - action: persistent_notification.create
            data:
              title: "✅ Urządzenie ONLINE"
              message: >-
                {{ trigger.to_state.name }} ponownie działa.
                Encja: {{ trigger.entity_id }}
          - if:
              - condition: template
                value_template: "{{ enable_mobile_notifications_var }}"
            then:
              - action: "{{ mobile_notify_service_var }}"
                data:
                  title: "✅ Serwerownia - ONLINE"
                  message: "{{ trigger.to_state.name }} ponownie działa."

      - conditions:
          - condition: trigger
            id: storage_warning
        sequence:
          - action: persistent_notification.create
            data:
              title: "🟠 Storage - mało miejsca"
              message: >-
                {{ trigger.to_state.name }}: zajęcie {{ trigger.to_state.state }}%.
          - if:
              - condition: template
                value_template: "{{ enable_mobile_notifications_var }}"
            then:
              - action: "{{ mobile_notify_service_var }}"
                data:
                  title: "🟠 Storage - ostrzeżenie"
                  message: "{{ trigger.to_state.name }}: {{ trigger.to_state.state }}% zajęte."
          - choose: []
            default: !input custom_actions

      - conditions:
          - condition: trigger
            id: storage_critical
        sequence:
          - action: persistent_notification.create
            data:
              title: "🔴 Storage - poziom krytyczny"
              message: >-
                {{ trigger.to_state.name }}: zajęcie {{ trigger.to_state.state }}%.
          - if:
              - condition: template
                value_template: "{{ enable_mobile_notifications_var }}"
            then:
              - action: "{{ mobile_notify_service_var }}"
                data:
                  title: "🔴 Storage - KRYTYCZNY"
                  message: "{{ trigger.to_state.name }}: {{ trigger.to_state.state }}% zajęte."
          - choose: []
            default: !input custom_actions

      - conditions:
          - condition: trigger
            id: storage_recovered
          - condition: template
            value_template: "{{ notify_recovery_var }}"
        sequence:
          - action: persistent_notification.create
            data:
              title: "✅ Storage wrócił do normy"
              message: >-
                {{ trigger.to_state.name }}: zajęcie spadło do {{ trigger.to_state.state }}%.
          - if:
              - condition: template
                value_template: "{{ enable_mobile_notifications_var }}"
            then:
              - action: "{{ mobile_notify_service_var }}"
                data:
                  title: "✅ Storage OK"
                  message: "{{ trigger.to_state.name }}: {{ trigger.to_state.state }}% zajęte."

      - conditions:
          - condition: trigger
            id: seagate_smart_problem
        sequence:
          - action: persistent_notification.create
            data:
              title: "🔴 Seagate - SMART"
              message: >-
                Pogorszenie stanu SMART dysku.
                Pending: {{ states(seagate_pending_entity_var) }},
                Offline uncorrectable: {{ states(seagate_uncorrectable_entity_var) }},
                Reallocated: {{ states(seagate_reallocated_entity_var) }}.
          - if:
              - condition: template
                value_template: "{{ enable_mobile_notifications_var }}"
            then:
              - action: "{{ mobile_notify_service_var }}"
                data:
                  title: "🔴 Seagate - SMART"
                  message: >-
                    SMART pogorszył się. Pending: {{ states(seagate_pending_entity_var) }},
                    Uncorrectable: {{ states(seagate_uncorrectable_entity_var) }},
                    Reallocated: {{ states(seagate_reallocated_entity_var) }}.
          - choose: []
            default: !input custom_actions

      - conditions:
          - condition: trigger
            id: seagate_smart_recovered
          - condition: template
            value_template: "{{ notify_recovery_var }}"
        sequence:
          - action: persistent_notification.create
            data:
              title: "✅ Seagate - SMART OK"
              message: >-
                Stan SMART wrócił poniżej ustawionych progów alarmowych.
                Pending: {{ states(seagate_pending_entity_var) }},
                Offline uncorrectable: {{ states(seagate_uncorrectable_entity_var) }},
                Reallocated: {{ states(seagate_reallocated_entity_var) }}.
          - if:
              - condition: template
                value_template: "{{ enable_mobile_notifications_var }}"
            then:
              - action: "{{ mobile_notify_service_var }}"
                data:
                  title: "✅ Seagate - SMART OK"
                  message: >-
                    SMART wrócił do ustawionej normy.
                    Pending: {{ states(seagate_pending_entity_var) }},
                    Uncorrectable: {{ states(seagate_uncorrectable_entity_var) }},
                    Reallocated: {{ states(seagate_reallocated_entity_var) }}.

      - conditions:
          - condition: trigger
            id: seagate_temp_warning
        sequence:
          - action: persistent_notification.create
            data:
              title: "🟠 Seagate - wysoka temperatura"
              message: >-
                Temperatura dysku: {{ trigger.to_state.state }} °C.
          - if:
              - condition: template
                value_template: "{{ enable_mobile_notifications_var }}"
            then:
              - action: "{{ mobile_notify_service_var }}"
                data:
                  title: "🟠 Seagate - temperatura"
                  message: "Temperatura dysku wzrosła do {{ trigger.to_state.state }} °C."
          - choose: []
            default: !input custom_actions

      - conditions:
          - condition: trigger
            id: seagate_temp_critical
        sequence:
          - action: persistent_notification.create
            data:
              title: "🔴 Seagate - temperatura KRYTYCZNA"
              message: >-
                Temperatura dysku: {{ trigger.to_state.state }} °C.
          - if:
              - condition: template
                value_template: "{{ enable_mobile_notifications_var }}"
            then:
              - action: "{{ mobile_notify_service_var }}"
                data:
                  title: "🔴 Seagate - temperatura KRYTYCZNA"
                  message: "Temperatura dysku wzrosła do {{ trigger.to_state.state }} °C."
          - choose: []
            default: !input custom_actions

      - conditions:
          - condition: trigger
            id: seagate_temp_recovered
          - condition: template
            value_template: "{{ notify_recovery_var }}"
        sequence:
          - action: persistent_notification.create
            data:
              title: "✅ Seagate - temperatura OK"
              message: >-
                Temperatura dysku spadła do {{ trigger.to_state.state }} °C.
          - if:
              - condition: template
                value_template: "{{ enable_mobile_notifications_var }}"
            then:
              - action: "{{ mobile_notify_service_var }}"
                data:
                  title: "✅ Seagate - temperatura OK"
                  message: "Temperatura dysku spadła do {{ trigger.to_state.state }} °C."

      - conditions:
          - condition: trigger
            id: ram_warning
        sequence:
          - action: persistent_notification.create
            data:
              title: "🟠 Wysokie użycie RAM"
              message: >-
                {{ trigger.to_state.name }}: użycie RAM {{ trigger.to_state.state }}%.
          - if:
              - condition: template
                value_template: "{{ enable_mobile_notifications_var }}"
            then:
              - action: "{{ mobile_notify_service_var }}"
                data:
                  title: "🟠 RAM - wysokie użycie"
                  message: "{{ trigger.to_state.name }}: {{ trigger.to_state.state }}% RAM."
          - choose: []
            default: !input custom_actions

      - conditions:
          - condition: trigger
            id: ram_recovered
          - condition: template
            value_template: "{{ notify_recovery_var }}"
        sequence:
          - action: persistent_notification.create
            data:
              title: "✅ RAM wrócił do normy"
              message: >-
                {{ trigger.to_state.name }}: użycie RAM spadło do {{ trigger.to_state.state }}%.
          - if:
              - condition: template
                value_template: "{{ enable_mobile_notifications_var }}"
            then:
              - action: "{{ mobile_notify_service_var }}"
                data:
                  title: "✅ RAM OK"
                  message: "{{ trigger.to_state.name }}: {{ trigger.to_state.state }}% RAM."

mode: queued
max: 30
