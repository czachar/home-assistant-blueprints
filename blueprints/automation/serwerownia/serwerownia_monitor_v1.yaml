blueprint:
  name: "Serwerownia Monitor v1.3.5"
  description: >
    Centralny monitoring serwerowni: UPS/NUT, VM/LXC, storage, RAM, Seagate SMART
    oraz host Proxmox z dyskiem Patriot SSD i zajęciem dysku systemowego.
    Tworzy trwałe powiadomienia Home Assistant oraz opcjonalne powiadomienia PUSH.
  domain: automation
  source_url: "https://raw.githubusercontent.com/czachar/home-assistant-blueprints/main/blueprints/automation/serwerownia/serwerownia_monitor_v1.yaml"
  homeassistant:
    min_version: 2024.6.0

  input:
    ups_section:
      name: "UPS / Zasilanie"
      icon: mdi:power-plug-battery
      collapsed: true
      input:
        ups_status_entity:
          name: "Status UPS (NUT)"
          description: "Np. sensor.ups_dane_stanu"
          default: sensor.ups_dane_stanu
          selector:
            entity:
              filter:
                - domain: sensor
        ups_load_entity:
          name: "Obciążenie UPS"
          description: "Np. sensor.ups_obciazenie"
          default: sensor.ups_obciazenie
          selector:
            entity:
              filter:
                - domain: sensor
        ups_battery_voltage_entity:
          name: "Napięcie baterii UPS"
          description: "Np. sensor.ups_napiecie_baterii"
          default: sensor.ups_napiecie_baterii
          selector:
            entity:
              filter:
                - domain: sensor
        ups_input_voltage_entity:
          name: "Napięcie wejściowe UPS"
          description: "Np. sensor.ups_napiecie_wejsciowe"
          default: sensor.ups_napiecie_wejsciowe
          selector:
            entity:
              filter:
                - domain: sensor
        ups_on_battery_state:
          name: "ON BATTERY - kod NUT"
          default: "OB"
          selector:
            text: {}
        ups_online_state:
          name: "ON LINE - kod NUT"
          default: "OL"
          selector:
            text: {}

    devices_section:
      name: "VM / LXC / Urządzenia"
      icon: mdi:server
      collapsed: true
      input:
        monitored_entities:
          name: "Monitorowane encje"
          description: "Statusy VM/LXC: OMV, ownCloud, Jellyfin, Pi-hole, CODEX."
          default:
            - binary_sensor.qemu_omv_101_status
            - binary_sensor.qemu_owncloud_102_status
            - binary_sensor.qemu_codex_dev_103_status
            - binary_sensor.lxc_jellyfin_104_status
            - binary_sensor.lxc_pihole_105_status
          selector:
            entity:
              multiple: true
        device_offline_state:
          name: "Stan oznaczający offline"
          default: "off"
          selector:
            text: {}
        device_online_state:
          name: "Stan oznaczający online"
          default: "on"
          selector:
            text: {}
        offline_delay:
          name: "Alarm po czasie offline"
          default:
            hours: 0
            minutes: 5
            seconds: 0
          selector:
            duration: {}

    storage_section:
      name: "Storage / Dyski"
      icon: mdi:harddisk
      collapsed: true
      input:
        storage_entities:
          name: "Sensory zajętości storage"
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: sensor
        storage_warning_threshold:
          name: "Próg ostrzeżenia"
          default: 80
          selector:
            number:
              min: 50
              max: 99
              step: 1
              unit_of_measurement: "%"
        storage_critical_threshold:
          name: "Próg krytyczny"
          default: 90
          selector:
            number:
              min: 60
              max: 100
              step: 1
              unit_of_measurement: "%"
        storage_delay:
          name: "Czas utrzymania przekroczenia"
          default:
            hours: 0
            minutes: 10
            seconds: 0
          selector:
            duration: {}

    seagate_section:
      name: "Seagate / SMART"
      icon: mdi:alert-circle
      collapsed: true
      input:
        seagate_smart_problem_entity:
          name: "Seagate SMART Problem"
          description: >
            U Ciebie sensor alarmuje dopiero po pogorszeniu bazy:
            Pending > 8, Uncorrectable > 8 lub Reallocated > 0.
          default: binary_sensor.seagate_smart_problem
          selector:
            entity:
              filter:
                - domain: binary_sensor
        seagate_temperature_entity:
          name: "Temperatura Seagate"
          default: sensor.seagate_temperature
          selector:
            entity:
              filter:
                - domain: sensor
        seagate_pending_entity:
          name: "Pending sectors"
          default: sensor.seagate_pending_sectors
          selector:
            entity:
              filter:
                - domain: sensor
        seagate_uncorrectable_entity:
          name: "Offline uncorrectable"
          default: sensor.seagate_offline_uncorrectable
          selector:
            entity:
              filter:
                - domain: sensor
        seagate_reallocated_entity:
          name: "Reallocated sectors"
          default: sensor.seagate_reallocated_sectors
          selector:
            entity:
              filter:
                - domain: sensor
        seagate_temp_warning_threshold:
          name: "Temperatura - ostrzeżenie"
          default: 45
          selector:
            number:
              min: 30
              max: 70
              step: 1
              unit_of_measurement: "°C"
        seagate_temp_critical_threshold:
          name: "Temperatura - alarm krytyczny"
          default: 50
          selector:
            number:
              min: 35
              max: 80
              step: 1
              unit_of_measurement: "°C"
        seagate_temp_recovery_threshold:
          name: "Temperatura - powrót do normy"
          default: 43
          selector:
            number:
              min: 20
              max: 60
              step: 1
              unit_of_measurement: "°C"
        seagate_temp_delay:
          name: "Czas utrzymania temperatury"
          default:
            hours: 0
            minutes: 2
            seconds: 0
          selector:
            duration: {}

    proxmox_section:
      name: "Proxmox / Patriot SSD"
      icon: mdi:server-security
      collapsed: true
      input:
        proxmox_cpu_temperature_entity:
          name: "Temperatura CPU Proxmox"
          default: sensor.192_168_40_10_package_id_0_temperature
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature
        proxmox_cpu_warning_threshold:
          name: "CPU - ostrzeżenie"
          default: 75
          selector:
            number:
              min: 40
              max: 95
              step: 1
              unit_of_measurement: "°C"
        proxmox_cpu_critical_threshold:
          name: "CPU - alarm krytyczny"
          default: 85
          selector:
            number:
              min: 50
              max: 100
              step: 1
              unit_of_measurement: "°C"
        proxmox_cpu_recovery_threshold:
          name: "CPU - powrót do normy"
          default: 70
          selector:
            number:
              min: 30
              max: 90
              step: 1
              unit_of_measurement: "°C"
        proxmox_cpu_delay:
          name: "Czas utrzymania temperatury CPU"
          default:
            hours: 0
            minutes: 2
            seconds: 0
          selector:
            duration: {}
        proxmox_disk_usage_entity:
          name: "Zajęcie dysku systemowego Proxmox /"
          description: "Glances 192.168.40.10 — / disk usage. Używa progów Storage 80/90%."
          default: sensor.192_168_40_10_disk_usage
          selector:
            entity:
              filter:
                - domain: sensor
        patriot_health_entity:
          name: "Patriot SSD Health"
          description: "Natywny sensor Glances/SMART. off = zdrowy, on = problem."
          default: binary_sensor.disk_serwer_patriot_burst_health
          selector:
            entity:
              filter:
                - domain: binary_sensor
        patriot_temperature_entity:
          name: "Temperatura Patriot SSD"
          default: sensor.disk_serwer_patriot_burst_temperature
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature
        patriot_temp_warning_threshold:
          name: "SSD - ostrzeżenie"
          default: 55
          selector:
            number:
              min: 30
              max: 75
              step: 1
              unit_of_measurement: "°C"
        patriot_temp_critical_threshold:
          name: "SSD - alarm krytyczny"
          default: 65
          selector:
            number:
              min: 40
              max: 85
              step: 1
              unit_of_measurement: "°C"
        patriot_temp_recovery_threshold:
          name: "SSD - powrót do normy"
          default: 50
          selector:
            number:
              min: 20
              max: 70
              step: 1
              unit_of_measurement: "°C"
        patriot_temp_delay:
          name: "Czas utrzymania temperatury SSD"
          default:
            hours: 0
            minutes: 2
            seconds: 0
          selector:
            duration: {}

    ram_section:
      name: "RAM"
      icon: mdi:memory
      collapsed: true
      input:
        ram_entity:
          name: "Sensor RAM"
          description: "Realny RAM OMV z Glances."
          default: sensor.192_168_30_10_memory_usage
          selector:
            entity:
              filter:
                - domain: sensor
        ram_warning_threshold:
          name: "Próg RAM"
          default: 90
          selector:
            number:
              min: 50
              max: 100
              step: 1
              unit_of_measurement: "%"
        ram_recovery_threshold:
          name: "Próg powrotu RAM do normy"
          default: 80
          selector:
            number:
              min: 20
              max: 99
              step: 1
              unit_of_measurement: "%"
        ram_delay:
          name: "Alarm RAM po czasie"
          default:
            hours: 0
            minutes: 10
            seconds: 0
          selector:
            duration: {}

    notification_section:
      name: "Powiadomienia"
      icon: mdi:bell-alert
      collapsed: true
      input:
        notify_recovery:
          name: "Powiadamiaj o powrocie do normy"
          default: true
          selector:
            boolean: {}
        enable_mobile_notifications:
          name: "Powiadomienia PUSH do aplikacji"
          default: true
          selector:
            boolean: {}
        mobile_notify_service:
          name: "Usługa powiadomień telefonu"
          default: "notify.mobile_app_s24_ultra"
          selector:
            text: {}
        custom_actions:
          name: "Dodatkowe akcje po każdym alarmie"
          default: []
          selector:
            action: {}

variables:
  ups_load_entity_var: !input ups_load_entity
  ups_battery_voltage_entity_var: !input ups_battery_voltage_entity
  ups_input_voltage_entity_var: !input ups_input_voltage_entity
  seagate_pending_entity_var: !input seagate_pending_entity
  seagate_uncorrectable_entity_var: !input seagate_uncorrectable_entity
  seagate_reallocated_entity_var: !input seagate_reallocated_entity
  notify_recovery_var: !input notify_recovery
  enable_mobile_notifications_var: !input enable_mobile_notifications
  mobile_notify_service_var: !input mobile_notify_service

triggers:
  - trigger: state
    entity_id: !input ups_status_entity
    to: !input ups_on_battery_state
    id: ups_on_battery
  - trigger: state
    entity_id: !input ups_status_entity
    from: !input ups_on_battery_state
    to: !input ups_online_state
    id: ups_online
  - trigger: state
    entity_id: !input monitored_entities
    to: !input device_offline_state
    for: !input offline_delay
    id: device_offline
  - trigger: state
    entity_id: !input monitored_entities
    from: !input device_offline_state
    to: !input device_online_state
    id: device_online

  - trigger: numeric_state
    entity_id: !input storage_entities
    above: !input storage_warning_threshold
    for: !input storage_delay
    id: storage_warning
  - trigger: numeric_state
    entity_id: !input storage_entities
    above: !input storage_critical_threshold
    for: !input storage_delay
    id: storage_critical
  - trigger: numeric_state
    entity_id: !input storage_entities
    below: !input storage_warning_threshold
    id: storage_recovered

  - trigger: state
    entity_id: !input seagate_smart_problem_entity
    from: "off"
    to: "on"
    id: seagate_smart_problem
  - trigger: state
    entity_id: !input seagate_smart_problem_entity
    from: "on"
    to: "off"
    id: seagate_smart_recovered
  - trigger: numeric_state
    entity_id: !input seagate_temperature_entity
    above: !input seagate_temp_warning_threshold
    for: !input seagate_temp_delay
    id: seagate_temp_warning
  - trigger: numeric_state
    entity_id: !input seagate_temperature_entity
    above: !input seagate_temp_critical_threshold
    for: !input seagate_temp_delay
    id: seagate_temp_critical
  - trigger: numeric_state
    entity_id: !input seagate_temperature_entity
    below: !input seagate_temp_recovery_threshold
    for: !input seagate_temp_delay
    id: seagate_temp_recovered

  - trigger: numeric_state
    entity_id: !input proxmox_cpu_temperature_entity
    above: !input proxmox_cpu_warning_threshold
    for: !input proxmox_cpu_delay
    id: proxmox_cpu_warning
  - trigger: numeric_state
    entity_id: !input proxmox_cpu_temperature_entity
    above: !input proxmox_cpu_critical_threshold
    for: !input proxmox_cpu_delay
    id: proxmox_cpu_critical
  - trigger: numeric_state
    entity_id: !input proxmox_cpu_temperature_entity
    below: !input proxmox_cpu_recovery_threshold
    for: !input proxmox_cpu_delay
    id: proxmox_cpu_recovered

  - trigger: numeric_state
    entity_id: !input proxmox_disk_usage_entity
    above: !input storage_warning_threshold
    for: !input storage_delay
    id: proxmox_disk_warning
  - trigger: numeric_state
    entity_id: !input proxmox_disk_usage_entity
    above: !input storage_critical_threshold
    for: !input storage_delay
    id: proxmox_disk_critical
  - trigger: numeric_state
    entity_id: !input proxmox_disk_usage_entity
    below: !input storage_warning_threshold
    id: proxmox_disk_recovered

  - trigger: state
    entity_id: !input patriot_health_entity
    from: "off"
    to: "on"
    id: patriot_health_problem
  - trigger: state
    entity_id: !input patriot_health_entity
    from: "on"
    to: "off"
    id: patriot_health_recovered
  - trigger: numeric_state
    entity_id: !input patriot_temperature_entity
    above: !input patriot_temp_warning_threshold
    for: !input patriot_temp_delay
    id: patriot_temp_warning
  - trigger: numeric_state
    entity_id: !input patriot_temperature_entity
    above: !input patriot_temp_critical_threshold
    for: !input patriot_temp_delay
    id: patriot_temp_critical
  - trigger: numeric_state
    entity_id: !input patriot_temperature_entity
    below: !input patriot_temp_recovery_threshold
    for: !input patriot_temp_delay
    id: patriot_temp_recovered

  - trigger: numeric_state
    entity_id: !input ram_entity
    above: !input ram_warning_threshold
    for: !input ram_delay
    id: ram_warning
  - trigger: numeric_state
    entity_id: !input ram_entity
    below: !input ram_recovery_threshold
    id: ram_recovered

conditions: []

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: ups_on_battery
        sequence:
          - action: persistent_notification.create
            data:
              title: "⚠️ UPS - ON BATTERY"
              message: >-
                Zanik zasilania sieciowego. Obciążenie: {{ states(ups_load_entity_var) }}%.
                Bateria: {{ states(ups_battery_voltage_entity_var) }} V.
          - if:
              - condition: template
                value_template: "{{ enable_mobile_notifications_var }}"
            then:
              - action: "{{ mobile_notify_service_var }}"
                data:
                  title: "⚠️ UPS - ON BATTERY"
                  message: >-
                    Zanik zasilania. Obciążenie UPS: {{ states(ups_load_entity_var) }}%.
                    Bateria: {{ states(ups_battery_voltage_entity_var) }} V.
          - choose: []
            default: !input custom_actions

      - conditions:
          - condition: trigger
            id: ups_online
          - condition: template
            value_template: "{{ notify_recovery_var }}"
        sequence:
          - action: persistent_notification.create
            data:
              title: "✅ UPS - ON LINE"
              message: >-
                Zasilanie wróciło. Napięcie wejściowe: {{ states(ups_input_voltage_entity_var) }} V.
                Bateria: {{ states(ups_battery_voltage_entity_var) }} V.
          - if:
              - condition: template
                value_template: "{{ enable_mobile_notifications_var }}"
            then:
              - action: "{{ mobile_notify_service_var }}"
                data:
                  title: "✅ UPS - ON LINE"
                  message: >-
                    Zasilanie wróciło. Napięcie wejściowe: {{ states(ups_input_voltage_entity_var) }} V.
                    Bateria: {{ states(ups_battery_voltage_entity_var) }} V.

      - conditions:
          - condition: trigger
            id: device_offline
        sequence:
          - action: persistent_notification.create
            data:
              title: "🔴 Urządzenie OFFLINE"
              message: "{{ trigger.to_state.name }} jest offline od wymaganego czasu."
          - if:
              - condition: template
                value_template: "{{ enable_mobile_notifications_var }}"
            then:
              - action: "{{ mobile_notify_service_var }}"
                data:
                  title: "🔴 Serwerownia - OFFLINE"
                  message: "{{ trigger.to_state.name }} jest offline."
          - choose: []
            default: !input custom_actions

      - conditions:
          - condition: trigger
            id: device_online
          - condition: template
            value_template: "{{ notify_recovery_var }}"
        sequence:
          - action: persistent_notification.create
            data:
              title: "✅ Urządzenie ONLINE"
              message: "{{ trigger.to_state.name }} ponownie działa."
          - if:
              - condition: template
                value_template: "{{ enable_mobile_notifications_var }}"
            then:
              - action: "{{ mobile_notify_service_var }}"
                data:
                  title: "✅ Serwerownia - ONLINE"
                  message: "{{ trigger.to_state.name }} ponownie działa."

      - conditions:
          - condition: trigger
            id: storage_warning
        sequence:
          - action: persistent_notification.create
            data:
              title: "🟠 Storage - mało miejsca"
              message: "{{ trigger.to_state.name }}: zajęcie {{ trigger.to_state.state }}%."
          - if:
              - condition: template
                value_template: "{{ enable_mobile_notifications_var }}"
            then:
              - action: "{{ mobile_notify_service_var }}"
                data:
                  title: "🟠 Storage - ostrzeżenie"
                  message: "{{ trigger.to_state.name }}: {{ trigger.to_state.state }}% zajęte."
          - choose: []
            default: !input custom_actions

      - conditions:
          - condition: trigger
            id: storage_critical
        sequence:
          - action: persistent_notification.create
            data:
              title: "🔴 Storage - poziom krytyczny"
              message: "{{ trigger.to_state.name }}: zajęcie {{ trigger.to_state.state }}%."
          - if:
              - condition: template
                value_template: "{{ enable_mobile_notifications_var }}"
            then:
              - action: "{{ mobile_notify_service_var }}"
                data:
                  title: "🔴 Storage - KRYTYCZNY"
                  message: "{{ trigger.to_state.name }}: {{ trigger.to_state.state }}% zajęte."
          - choose: []
            default: !input custom_actions

      - conditions:
          - condition: trigger
            id: storage_recovered
          - condition: template
            value_template: "{{ notify_recovery_var }}"
        sequence:
          - action: persistent_notification.create
            data:
              title: "✅ Storage wrócił do normy"
              message: "{{ trigger.to_state.name }}: {{ trigger.to_state.state }}% zajęte."
          - if:
              - condition: template
                value_template: "{{ enable_mobile_notifications_var }}"
            then:
              - action: "{{ mobile_notify_service_var }}"
                data:
                  title: "✅ Storage OK"
                  message: "{{ trigger.to_state.name }}: {{ trigger.to_state.state }}% zajęte."

      - conditions:
          - condition: trigger
            id: seagate_smart_problem
        sequence:
          - action: persistent_notification.create
            data:
              title: "🔴 Seagate - SMART"
              message: >-
                Pogorszenie SMART. Pending: {{ states(seagate_pending_entity_var) }},
                Uncorrectable: {{ states(seagate_uncorrectable_entity_var) }},
                Reallocated: {{ states(seagate_reallocated_entity_var) }}.
          - if:
              - condition: template
                value_template: "{{ enable_mobile_notifications_var }}"
            then:
              - action: "{{ mobile_notify_service_var }}"
                data:
                  title: "🔴 Seagate - SMART"
                  message: >-
                    Pending: {{ states(seagate_pending_entity_var) }},
                    Uncorrectable: {{ states(seagate_uncorrectable_entity_var) }},
                    Reallocated: {{ states(seagate_reallocated_entity_var) }}.
          - choose: []
            default: !input custom_actions

      - conditions:
          - condition: trigger
            id: seagate_smart_recovered
          - condition: template
            value_template: "{{ notify_recovery_var }}"
        sequence:
          - action: persistent_notification.create
            data:
              title: "✅ Seagate - SMART OK"
              message: "SMART wrócił poniżej ustawionych progów alarmowych."
          - if:
              - condition: template
                value_template: "{{ enable_mobile_notifications_var }}"
            then:
              - action: "{{ mobile_notify_service_var }}"
                data:
                  title: "✅ Seagate - SMART OK"
                  message: "SMART wrócił do ustawionej normy."

      - conditions:
          - condition: trigger
            id: seagate_temp_warning
        sequence:
          - action: persistent_notification.create
            data:
              title: "🟠 Seagate - wysoka temperatura"
              message: "Temperatura dysku: {{ trigger.to_state.state }} °C."
          - if:
              - condition: template
                value_template: "{{ enable_mobile_notifications_var }}"
            then:
              - action: "{{ mobile_notify_service_var }}"
                data:
                  title: "🟠 Seagate - temperatura"
                  message: "Temperatura dysku wzrosła do {{ trigger.to_state.state }} °C."
          - choose: []
            default: !input custom_actions

      - conditions:
          - condition: trigger
            id: seagate_temp_critical
        sequence:
          - action: persistent_notification.create
            data:
              title: "🔴 Seagate - temperatura KRYTYCZNA"
              message: "Temperatura dysku: {{ trigger.to_state.state }} °C."
          - if:
              - condition: template
                value_template: "{{ enable_mobile_notifications_var }}"
            then:
              - action: "{{ mobile_notify_service_var }}"
                data:
                  title: "🔴 Seagate - temperatura KRYTYCZNA"
                  message: "Temperatura dysku wzrosła do {{ trigger.to_state.state }} °C."
          - choose: []
            default: !input custom_actions

      - conditions:
          - condition: trigger
            id: seagate_temp_recovered
          - condition: template
            value_template: "{{ notify_recovery_var }}"
        sequence:
          - action: persistent_notification.create
            data:
              title: "✅ Seagate - temperatura OK"
              message: "Temperatura dysku spadła do {{ trigger.to_state.state }} °C."
          - if:
              - condition: template
                value_template: "{{ enable_mobile_notifications_var }}"
            then:
              - action: "{{ mobile_notify_service_var }}"
                data:
                  title: "✅ Seagate - temperatura OK"
                  message: "Temperatura dysku spadła do {{ trigger.to_state.state }} °C."

      - conditions:
          - condition: trigger
            id: proxmox_cpu_warning
        sequence:
          - action: persistent_notification.create
            data:
              title: "🟠 Proxmox - wysoka temperatura CPU"
              message: "CPU Package: {{ trigger.to_state.state }} °C."
          - if:
              - condition: template
                value_template: "{{ enable_mobile_notifications_var }}"
            then:
              - action: "{{ mobile_notify_service_var }}"
                data:
                  title: "🟠 Proxmox - temperatura CPU"
                  message: "CPU Package wzrósł do {{ trigger.to_state.state }} °C."
          - choose: []
            default: !input custom_actions

      - conditions:
