# SATEL Gateway 0.11 — powiadomienia Home Assistant, package v1.0
# Instalacja: /config/packages/satel_notifications.yaml, następnie kontrola
# konfiguracji i pełny restart HA. Nie wklejaj do edytora dashboardu.
# Odbiorca PUSH: notify.mobile_app_s24_ultra (istniejący odbiorca Serwerowni).
# Gateway: integra_test. Zmieniając go, zamień wystąpienia tej wartości w szablonach.
#
# Pamięć zawiera ostatnie POTWIERDZONE aktywne sygnały, również kiedy ich źródło
# jest niedostępne. Jej stan nie jest bieżącym potwierdzeniem sprawności centrali.
# Nie zmieniaj identyfikatorów pomocniczych encji tego pakietu w interfejsie HA.
# Zwykłe naruszenia PIR/drzwi, blokady, pamięci i wyjścia nie wysyłają PUSH.
# Aktualne naruszenia smoke/moisture oraz alarmy/sabotaże są zgłaszane także
# w trybie serwisowym. Odtwarzanie trwałych atrybutów wymaga zachowania danych HA.

input_boolean:
  satel_powiadomienia_gotowe:
    name: SATEL powiadomienia — rozruch zakończony
    icon: mdi:progress-check
    initial: false
  satel_powiadomienia_awaria_lacznosci:
    name: SATEL powiadomienia — zgłoszony brak danych
    icon: mdi:lan-disconnect
    # Bez initial: HA przywraca informację, czy zgłoszono trwającą przerwę.

template:
  - triggers:
      - trigger: homeassistant
        event: start
        id: start
      - trigger: time_pattern
        seconds: "/15"
        id: scan
      - trigger: event
        event_type: state_changed
        id: entity
    variables:
      gateway_id: integra_test
    conditions:
      - condition: template
        value_template: >-
          {% if trigger.id != 'entity' %}
            {{ true }}
          {% elif trigger.event.data.entity_id == 'input_boolean.satel_powiadomienia_gotowe' %}
            {{ true }}
          {% else %}
            {% set s = trigger.event.data.new_state %}
            {% set a = s.attributes if s is not none else {} %}
            {{ a.get('satel_gateway') == gateway_id and
               ((s.entity_id.startswith('binary_sensor.') and
                 ((a.get('satel_kind') in ['zone', 'partition'] and
                   a.get('satel_field') in ['alarm', 'tamper', 'tamper_alarm', 'fire_alarm', 'violated']) or
                  (a.get('satel_kind') == 'system' and a.get('satel_field') == 'troubles'))) or
                (s.entity_id.startswith('sensor.') and
                 a.get('satel_kind') == 'troubles' and a.get('satel_field') == 'current')) }}
          {% endif %}
    sensor:
      - name: SATEL powiadomienia — pamięć
        default_entity_id: sensor.satel_powiadomienia_pamiec
        unique_id: satel_notifications_memory_v1
        icon: mdi:shield-alert-outline
        state: >-
          {{ 'monitoring' if is_state('input_boolean.satel_powiadomienia_gotowe', 'on') else 'starting' }}
        attributes:
          schema: satel_notifications_v1
          active: >-
            {% set saved = this.attributes.get('active', {}) if this is defined else {} %}
            {% set ns = namespace(active=saved if saved is mapping else {}) %}
            {% if is_state('input_boolean.satel_powiadomienia_gotowe', 'on') and trigger.id != 'start' %}
              {# Dokładny stan zdarzenia chroni krótkie impulsy on→off. #}
              {% if trigger.id == 'entity' and trigger.event.data.entity_id != 'input_boolean.satel_powiadomienia_gotowe' %}
                {% set observed = [trigger.event.data.new_state] %}
              {% else %}
                {% set observed = (states.binary_sensor | list) + (states.sensor | list) %}
              {% endif %}
              {% for s in observed if s is not none %}
                {% set a = s.attributes %}
                {% set kind = a.get('satel_kind') %}
                {% set field = a.get('satel_field') %}
                {% set number = a.get('satel_id') %}
                {% if a.get('satel_gateway') == gateway_id %}
                  {% set selected_binary =
                    (kind == 'zone' and
                     (field in ['alarm', 'tamper', 'tamper_alarm'] or
                      (field == 'violated' and a.get('device_class') in ['smoke', 'moisture']))) or
                    (kind == 'partition' and field in ['alarm', 'fire_alarm']) or
                    (kind == 'system' and field == 'troubles') %}
                  {% if s.entity_id.startswith('binary_sensor.') and selected_binary and number is number and s.state in ['on', 'off'] %}
                    {# Duplikat tego samego kanału nie może skasować jego alarmu. #}
                    {% set matching = states.binary_sensor
                      | selectattr('attributes.satel_gateway', 'defined')
                      | selectattr('attributes.satel_gateway', 'eq', gateway_id)
                      | selectattr('attributes.satel_kind', 'defined')
                      | selectattr('attributes.satel_kind', 'eq', kind)
                      | selectattr('attributes.satel_id', 'defined')
                      | selectattr('attributes.satel_id', 'eq', number)
                      | selectattr('attributes.satel_field', 'defined')
                      | selectattr('attributes.satel_field', 'eq', field) | list %}
                    {% if matching | count == 1 %}
                      {% set key = kind ~ ':' ~ number ~ ':' ~ field %}
                      {% if s.state == 'on' %}
                        {% set labels = {'alarm': 'Alarm', 'tamper': 'Sabotaż', 'tamper_alarm': 'Alarm sabotażowy', 'fire_alarm': 'Alarm pożarowy', 'troubles': 'Awaria (flaga ogólna)'} %}
                        {% set label = labels.get(field, 'Dym' if a.get('device_class') == 'smoke' else 'Zalanie') %}
                        {% set channel = 'Wejście' if kind == 'zone' else 'Strefa' %}
                        {% set source_name = a.get('satel_name') or s.name %}
                        {% set display_name = 'System · ' ~ label if kind == 'system' else channel ~ ' ' ~ number ~ ' · ' ~ source_name ~ ' · ' ~ label %}
                        {% set record = {'name': display_name, 'entity_id': s.entity_id,
                                         'category': 'trouble' if kind == 'system' else 'alarm'} %}
                        {% set ns.active = dict(ns.active, **{key: record}) %}
                      {% else %}
                        {% set ns.active = dict(ns.active.items() | rejectattr('0', 'eq', key)) %}
                      {% endif %}
                    {% endif %}
                  {% elif s.entity_id.startswith('sensor.') and kind == 'troubles' and field == 'current' %}
                    {% set matching = states.sensor
                      | selectattr('attributes.satel_gateway', 'defined')
                      | selectattr('attributes.satel_gateway', 'eq', gateway_id)
                      | selectattr('attributes.satel_kind', 'defined')
                      | selectattr('attributes.satel_kind', 'eq', 'troubles')
                      | selectattr('attributes.satel_field', 'defined')
                      | selectattr('attributes.satel_field', 'eq', 'current') | list %}
                    {% set faults = a.get('active') %}
                    {% set valid = namespace(ok=matching | count == 1 and
                       faults is sequence and faults is not string and faults is not mapping and
                       a.get('missing_parts') == [] and a.get('coverage') == 'parts_1_4' and
                       is_number(s.state), ids=[]) %}
                    {% if valid.ok %}
                      {% set valid.ok = s.state | float(-1) >= 0 and s.state | float(-1) == faults | count %}
                      {% for fault in faults %}
                        {% if fault is not mapping or fault.get('id') is not string or not fault.get('id') or
                              fault.get('name') is not string or not fault.get('name') or fault.get('id') in valid.ids %}
                          {% set valid.ok = false %}
                        {% else %}
                          {% set valid.ids = valid.ids + [fault.id] %}
                        {% endif %}
                      {% endfor %}
                    {% endif %}
                    {% if valid.ok %}
                      {# Tylko kompletny, poprawny current zastępuje listę awarii. #}
                      {% set keep = namespace(items=[]) %}
                      {% for key, value in ns.active.items() if not key.startswith('trouble:') %}
                        {% set keep.items = keep.items + [(key, value)] %}
                      {% endfor %}
                      {% set ns.active = dict(keep.items) %}
                      {% for fault in faults %}
                        {% set key = 'trouble:' ~ fault.id %}
                        {% set record = {'name': fault.name, 'entity_id': s.entity_id, 'category': 'trouble'} %}
                        {% set ns.active = dict(ns.active, **{key: record}) %}
                      {% endfor %}
                    {% endif %}
                  {% endif %}
                {% endif %}
              {% endfor %}
            {% endif %}
            {{ ns.active }}

  - binary_sensor:
      - name: SATEL powiadomienia — łączność
        default_entity_id: binary_sensor.satel_powiadomienia_lacznosc
        unique_id: satel_notifications_connectivity_v1
        device_class: connectivity
        # Zwłoka liczona od niedostępności encji w HA. Przy utracie pakietów
        # MQTT może najpierw upłynąć expire_after gatewaya (domyślnie 30 s).
        delay_off: "00:01:00"
        state: >-
          {% set sources = states.binary_sensor
            | selectattr('attributes.satel_gateway', 'defined')
            | selectattr('attributes.satel_gateway', 'eq', 'integra_test') | list %}
          {{ sources | selectattr('state', 'in', ['on', 'off']) | list | count > 0 }}

automation:
  - id: satel_notifications_startup_v1
    alias: SATEL — przygotowanie powiadomień
    description: >-
      Po rozruchu zbiera zastane stany do jednej wiadomości. Krótkie impulsy
      wyłącznie podczas tego początkowego okna nie są rejestrowane.
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: automation_reloaded
      - trigger: time_pattern
        minutes: "/1"
    conditions:
      - condition: state
        entity_id: input_boolean.satel_powiadomienia_gotowe
        state: "off"
    actions:
      - delay: "00:00:10"
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.satel_powiadomienia_gotowe
    mode: single
    max_exceeded: silent

  - id: satel_notifications_changes_v1
    alias: SATEL — alarmy, sabotaże i szczegółowe awarie
    description: >-
      Zgłasza różnice stabilnych identyfikatorów, także przy niezmienionej liczbie
      awarii. Nie zgłasza ustąpienia na podstawie unavailable, usuniętej encji lub
      częściowego odczytu. Nowy poprawny alarm działa niezależnie od innych źródeł.
    triggers:
      # Bez from/to: zmiana samych atrybutów też musi uruchomić automat.
      - trigger: state
        entity_id: sensor.satel_powiadomienia_pamiec
    conditions:
      - condition: state
        entity_id: input_boolean.satel_powiadomienia_gotowe
        state: "on"
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none and trigger.to_state is not none and
             trigger.from_state.attributes.get('schema') == 'satel_notifications_v1' and
             trigger.to_state.attributes.get('schema') == 'satel_notifications_v1' and
             not trigger.to_state.attributes.get('restored', false) }}
    actions:
      - variables:
          before: "{{ trigger.from_state.attributes.get('active', {}) }}"
          after: "{{ trigger.to_state.attributes.get('active', {}) }}"
      - variables:
          added: "{{ after.keys() | reject('in', before.keys()) | list | sort }}"
          cleared: "{{ before.keys() | reject('in', after.keys()) | list | sort }}"
      - condition: template
        value_template: "{{ added | count > 0 or cleared | count > 0 }}"
      - variables:
          notification_title: "{{ 'SATEL — aktywne zdarzenia' if added | count > 0 else 'SATEL — potwierdzone ustąpienie' }}"
          notification_message: |-
            {% if added | count > 0 %}
            Aktywne:
            {% for key in added[:12] %}
            • {{ after[key].name }}
            {% endfor %}
            {% if added | count > 12 %}
            … oraz {{ added | count - 12 }} kolejnych. Szczegóły w HA.
            {% endif %}
            {% endif %}
            {% if cleared | count > 0 %}
            Potwierdzono ustąpienie:
            {% for key in cleared[:12] %}
            • {{ before[key].name }}
            {% endfor %}
            {% if cleared | count > 12 %}
            … oraz {{ cleared | count - 12 }} kolejnych.
            {% endif %}
            {% endif %}
            Dotyczy wskazanych sygnałów; pozostałe mogą nadal zgłaszać problem lub być niedostępne.
      - action: persistent_notification.create
        data:
          notification_id: satel_alarm_changes
          title: "{{ notification_title }}"
          message: "{{ notification_message }}"
      - action: notify.mobile_app_s24_ultra
        continue_on_error: true
        data:
          title: "{{ notification_title }}"
          message: "{{ notification_message }}"
          data:
            group: satel
            # Stały tag celowo pominięty: kolejne różne zdarzenia nie zastępują się.
    mode: queued
    max: 100
    max_exceeded: warning

  - id: satel_notifications_connectivity_v1
    alias: SATEL — utrata i powrót danych
    description: >-
      Zgłasza brak wszystkich danych binarnych po 60 s i jeden powrót danych.
      Działający kontener nie oznacza działającej komunikacji. Powrót danych
      nie oznacza ustąpienia fizycznych alarmów ani kompletności wszystkich źródeł.
    triggers:
      - trigger: state
        entity_id: binary_sensor.satel_powiadomienia_lacznosc
      - trigger: time_pattern
        seconds: "/15"
    conditions:
      - condition: state
        entity_id: input_boolean.satel_powiadomienia_gotowe
        state: "on"
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.satel_powiadomienia_lacznosc
                state: "off"
              - condition: state
                entity_id: input_boolean.satel_powiadomienia_awaria_lacznosci
                state: "off"
              - condition: template
                value_template: >-
                  {% set sources = states.binary_sensor
                    | selectattr('attributes.satel_gateway', 'defined')
                    | selectattr('attributes.satel_gateway', 'eq', 'integra_test') | list %}
                  {{ sources | selectattr('state', 'in', ['on', 'off']) | list | count == 0 }}
            sequence:
              - action: persistent_notification.create
                data:
                  notification_id: satel_communication
                  title: SATEL — brak danych
                  message: >-
                    Od co najmniej 60 s HA nie ma dostępnych stanów binarnych SATEL.
                    Sprawdź gateway CT 106, połączenie ETHM i MQTT. Ostatnie alarmy
                    i awarie pozostają niepotwierdzone; brak danych nie oznacza ich ustąpienia.
              - action: notify.mobile_app_s24_ultra
                continue_on_error: true
                data:
                  title: SATEL — brak danych
                  message: >-
                    Od co najmniej 60 s HA nie ma dostępnych stanów binarnych SATEL.
                    Sprawdź gateway CT 106, połączenie ETHM i MQTT. Ostatnie alarmy
                    i awarie pozostają niepotwierdzone; brak danych nie oznacza ich ustąpienia.
                  data:
                    group: satel
                    tag: satel_communication
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.satel_powiadomienia_awaria_lacznosci
          - conditions:
              - condition: state
                entity_id: binary_sensor.satel_powiadomienia_lacznosc
                state: "on"
              - condition: state
                entity_id: input_boolean.satel_powiadomienia_awaria_lacznosci
                state: "on"
              # delay_off może nadal pokazywać on po utracie danych. Powrót
              # potwierdzamy także bezpośrednim sprawdzeniem bieżących źródeł.
              - condition: template
                value_template: >-
                  {% set sources = states.binary_sensor
                    | selectattr('attributes.satel_gateway', 'defined')
                    | selectattr('attributes.satel_gateway', 'eq', 'integra_test') | list %}
                  {{ sources | selectattr('state', 'in', ['on', 'off']) | list | count > 0 }}
            sequence:
              - action: persistent_notification.create
                data:
                  notification_id: satel_communication
                  title: SATEL — dane znów docierają
                  message: >-
                    HA ponownie otrzymuje stany binarne SATEL. To potwierdza powrót
                    danych, a nie brak alarmów lub kompletność wszystkich odczytów.
              - action: notify.mobile_app_s24_ultra
                continue_on_error: true
                data:
                  title: SATEL — dane znów docierają
                  message: >-
                    HA ponownie otrzymuje stany binarne SATEL. To potwierdza powrót
                    danych, a nie brak alarmów lub kompletność wszystkich odczytów.
                  data:
                    group: satel
                    tag: satel_communication
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.satel_powiadomienia_awaria_lacznosci
    mode: single
    max_exceeded: silent
