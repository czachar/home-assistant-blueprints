# SATEL Notifications Base v1.1 — baza dla dwóch blueprintów automatyzacji
# Instalacja: /config/packages/satel_notifications.yaml (zastępuje pełny pakiet v1).
# NIE ładuj jednocześnie starego pakietu i tego pliku: mają te same encje i ID.
# Baza sama nie wysyła powiadomień. Zaimportuj i skonfiguruj oba blueprinty:
# blueprints/automation/satel/satel_alarm_notifications.yaml
# blueprints/automation/satel/satel_connectivity_notifications.yaml
# Instrukcja: docs/satel-notifications/README_PL.md w repozytorium.
#
# Gateway domyślny: integra_test. Dla innego gatewaya zmień wszystkie wystąpienia
# integra_test w tej bazie i pole Gateway ID w blueprintcie łączności.
# Ta baza obsługuje jeden gateway. Nie kopiuj jej pod inną nazwą dla drugiej centrali.
# Nazwy i unique_id są zachowane, aby korzystać z dotychczasowej pamięci.
# Nie zmieniaj ręcznie identyfikatorów tych pomocników ani wartości ready/latch.
# Pamięć przechowuje ostatnie potwierdzone aktywne sygnały: brak danych nie kasuje alarmu.
# Stan 'monitoring' oznacza gotowość pamięci, nie potwierdzenie sprawności centrali.

input_boolean:
  satel_powiadomienia_gotowe:
    name: SATEL powiadomienia — rozruch zakończony
    icon: mdi:progress-check
    initial: false
  satel_powiadomienia_awaria_lacznosci:
    name: SATEL powiadomienia — zgłoszony brak danych
    icon: mdi:lan-disconnect
    # Bez initial: HA przywraca informację, czy zgłoszono trwającą przerwę.

template:
  - triggers:
      - trigger: homeassistant
        event: start
        id: start
      - trigger: time_pattern
        seconds: "/15"
        id: scan
      - trigger: event
        event_type: state_changed
        id: entity
    variables:
      gateway_id: integra_test
    conditions:
      - condition: template
        value_template: >-
          {% if trigger.id != 'entity' %}
            {{ true }}
          {% elif trigger.event.data.entity_id == 'input_boolean.satel_powiadomienia_gotowe' %}
            {{ true }}
          {% else %}
            {% set s = trigger.event.data.new_state %}
            {% set a = s.attributes if s is not none else {} %}
            {{ a.get('satel_gateway') == gateway_id and
               ((s.entity_id.startswith('binary_sensor.') and
                 ((a.get('satel_kind') in ['zone', 'partition'] and
                   a.get('satel_field') in ['alarm', 'tamper', 'tamper_alarm', 'fire_alarm', 'violated']) or
                  (a.get('satel_kind') == 'system' and a.get('satel_field') == 'troubles'))) or
                (s.entity_id.startswith('sensor.') and
                 a.get('satel_kind') == 'troubles' and a.get('satel_field') == 'current')) }}
          {% endif %}
    sensor:
      - name: SATEL powiadomienia — pamięć
        default_entity_id: sensor.satel_powiadomienia_pamiec
        unique_id: satel_notifications_memory_v1
        icon: mdi:shield-alert-outline
        state: >-
          {{ 'monitoring' if is_state('input_boolean.satel_powiadomienia_gotowe', 'on') else 'starting' }}
        attributes:
          schema: satel_notifications_v1
          gateway_id: "{{ gateway_id }}"
          active: >-
            {% set saved = this.attributes.get('active', {}) if this is defined else {} %}
            {% set ns = namespace(active=saved if saved is mapping else {}) %}
            {% if is_state('input_boolean.satel_powiadomienia_gotowe', 'on') and trigger.id != 'start' %}
              {# Dokładny stan zdarzenia chroni krótkie impulsy on→off. #}
              {% if trigger.id == 'entity' and trigger.event.data.entity_id != 'input_boolean.satel_powiadomienia_gotowe' %}
                {% set observed = [trigger.event.data.new_state] %}
              {% else %}
                {% set observed = (states.binary_sensor | list) + (states.sensor | list) %}
              {% endif %}
              {% for s in observed if s is not none %}
                {% set a = s.attributes %}
                {% set kind = a.get('satel_kind') %}
                {% set field = a.get('satel_field') %}
                {% set number = a.get('satel_id') %}
                {% if a.get('satel_gateway') == gateway_id %}
                  {% set selected_binary =
                    (kind == 'zone' and
                     (field in ['alarm', 'tamper', 'tamper_alarm'] or
                      (field == 'violated' and a.get('device_class') in ['smoke', 'moisture']))) or
                    (kind == 'partition' and field in ['alarm', 'fire_alarm']) or
                    (kind == 'system' and field == 'troubles') %}
                  {% if s.entity_id.startswith('binary_sensor.') and selected_binary and number is number and s.state in ['on', 'off'] %}
                    {# Duplikat tego samego kanału nie może skasować jego alarmu. #}
                    {% set matching = states.binary_sensor
                      | selectattr('attributes.satel_gateway', 'defined')
                      | selectattr('attributes.satel_gateway', 'eq', gateway_id)
                      | selectattr('attributes.satel_kind', 'defined')
                      | selectattr('attributes.satel_kind', 'eq', kind)
                      | selectattr('attributes.satel_id', 'defined')
                      | selectattr('attributes.satel_id', 'eq', number)
                      | selectattr('attributes.satel_field', 'defined')
                      | selectattr('attributes.satel_field', 'eq', field) | list %}
                    {% if matching | count == 1 %}
                      {% set key = kind ~ ':' ~ number ~ ':' ~ field %}
                      {% if s.state == 'on' %}
                        {% set labels = {'alarm': 'Alarm', 'tamper': 'Sabotaż', 'tamper_alarm': 'Alarm sabotażowy', 'fire_alarm': 'Alarm pożarowy', 'troubles': 'Awaria (flaga ogólna)'} %}
                        {% set label = labels.get(field, 'Dym' if a.get('device_class') == 'smoke' else 'Zalanie') %}
                        {% set channel = 'Wejście' if kind == 'zone' else 'Strefa' %}
                        {% set source_name = a.get('satel_name') or s.name %}
                        {% set display_name = 'System · ' ~ label if kind == 'system' else channel ~ ' ' ~ number ~ ' · ' ~ source_name ~ ' · ' ~ label %}
                        {% set record = {'name': display_name, 'entity_id': s.entity_id,
                                         'category': 'trouble' if kind == 'system' else 'alarm'} %}
                        {% set ns.active = dict(ns.active, **{key: record}) %}
                      {% else %}
                        {% set ns.active = dict(ns.active.items() | rejectattr('0', 'eq', key)) %}
                      {% endif %}
                    {% endif %}
                  {% elif s.entity_id.startswith('sensor.') and kind == 'troubles' and field == 'current' %}
                    {% set matching = states.sensor
                      | selectattr('attributes.satel_gateway', 'defined')
                      | selectattr('attributes.satel_gateway', 'eq', gateway_id)
                      | selectattr('attributes.satel_kind', 'defined')
                      | selectattr('attributes.satel_kind', 'eq', 'troubles')
                      | selectattr('attributes.satel_field', 'defined')
                      | selectattr('attributes.satel_field', 'eq', 'current') | list %}
                    {% set faults = a.get('active') %}
                    {% set valid = namespace(ok=matching | count == 1 and
                       faults is sequence and faults is not string and faults is not mapping and
                       a.get('missing_parts') == [] and a.get('coverage') == 'parts_1_4' and
                       is_number(s.state), ids=[]) %}
                    {% if valid.ok %}
                      {% set valid.ok = s.state | float(-1) >= 0 and s.state | float(-1) == faults | count %}
                      {% for fault in faults %}
                        {% if fault is not mapping or fault.get('id') is not string or not fault.get('id') or
                              fault.get('name') is not string or not fault.get('name') or fault.get('id') in valid.ids %}
                          {% set valid.ok = false %}
                        {% else %}
                          {% set valid.ids = valid.ids + [fault.id] %}
                        {% endif %}
                      {% endfor %}
                    {% endif %}
                    {% if valid.ok %}
                      {# Tylko kompletny, poprawny current zastępuje listę awarii. #}
                      {% set keep = namespace(items=[]) %}
                      {% for key, value in ns.active.items() if not key.startswith('trouble:') %}
                        {% set keep.items = keep.items + [(key, value)] %}
                      {% endfor %}
                      {% set ns.active = dict(keep.items) %}
                      {% for fault in faults %}
                        {% set key = 'trouble:' ~ fault.id %}
                        {% set record = {'name': fault.name, 'entity_id': s.entity_id, 'category': 'trouble'} %}
                        {% set ns.active = dict(ns.active, **{key: record}) %}
                      {% endfor %}
                    {% endif %}
                  {% endif %}
                {% endif %}
              {% endfor %}
            {% endif %}
            {{ ns.active }}

  - binary_sensor:
      - name: SATEL powiadomienia — łączność
        default_entity_id: binary_sensor.satel_powiadomienia_lacznosc
        unique_id: satel_notifications_connectivity_v1
        device_class: connectivity
        attributes:
          gateway_id: integra_test
        # Zwłoka liczona od niedostępności encji w HA. Przy utracie pakietów
        # MQTT może najpierw upłynąć expire_after gatewaya (domyślnie 30 s).
        delay_off: "00:01:00"
        state: >-
          {% set sources = states.binary_sensor
            | selectattr('attributes.satel_gateway', 'defined')
            | selectattr('attributes.satel_gateway', 'eq', 'integra_test') | list %}
          {{ sources | selectattr('state', 'in', ['on', 'off']) | list | count > 0 }}

automation:
  - id: satel_notifications_startup_v1
    alias: SATEL — przygotowanie powiadomień
    description: >-
      Po rozruchu zbiera zastane stany do jednej wiadomości. Krótkie impulsy
      wyłącznie podczas tego początkowego okna nie są rejestrowane.
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: automation_reloaded
      - trigger: time_pattern
        minutes: "/1"
    conditions:
      - condition: state
        entity_id: input_boolean.satel_powiadomienia_gotowe
        state: "off"
    actions:
      - delay: "00:00:10"
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.satel_powiadomienia_gotowe
    mode: single
    max_exceeded: silent
